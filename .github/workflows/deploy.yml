name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # The Google Cloud OIDC values are repository variables. Until configured,
    # CI still builds the container and this deployment job is skipped.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_SERVICE_NAME }}
      AR_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - name: Get source
        uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Ensure Artifact Registry repository exists
        shell: bash
        run: |
          gcloud artifacts repositories describe "$AR_REPOSITORY" \
            --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$AR_REPOSITORY" \
            --repository-format=docker --location="$REGION" \
            --project="$PROJECT_ID" --description="Images do MVP de ocorrências"
      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and publish container
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.GCP_SERVICE_NAME }}:${{ github.sha }}
      - name: Deploy revision to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${{ vars.GCP_SERVICE_NAME }}:${{ github.sha }}" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --min=0 --max=1 --cpu=1 --memory=512Mi --concurrency=8 \
            --set-env-vars=COOKIE_SECURE=true,PGSSLMODE=require \
            --set-secrets=FLASK_SECRET_KEY=FLASK_SECRET_KEY:latest,PGHOST=PGHOST:latest,PGPORT=PGPORT:latest,PGDATABASE=PGDATABASE:latest,PGUSER=PGUSER:latest,PGPASSWORD=PGPASSWORD:latest


